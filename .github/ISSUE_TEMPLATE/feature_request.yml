name: 功能建议
description: 分享使用场景和改进建议
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与当前阻碍
      description: 你想完成什么任务，目前哪里不方便？请勿包含敏感信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式或补充信息
