<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
<title id="title">Buildploy 产品架构</title><desc id="desc">通过浏览器工作台或 Windows 桌面版进入 Studio，平台支持云端服务与企业私有化部署，围绕同一项目工程协作开发并交付应用；业务应用可在云端或企业内网独立运行。Windows 桌面版当前为内部试用。</desc>
